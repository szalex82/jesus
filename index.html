<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf4fc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="主祷文背诵"><title>主祷文背诵</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fc;color:#193657;font-family:-apple-system,"PingFang SC",sans-serif}main{max-width:560px;margin:auto;padding:30px 16px 60px}h1{text-align:center;font-size:34px;margin:10px}header p{text-align:center;color:#71849b}nav,.buttons{display:flex;gap:7px;margin:20px 0}button{border:0;border-radius:13px;padding:13px 9px;background:#dce9fb;color:#214e80;font-size:15px;font-weight:600;cursor:pointer}nav button{flex:1;font-size:13px}button.on,.primary{background:#176be7;color:white}.card{background:white;border-radius:20px;padding:22px 17px;box-shadow:0 6px 24px #16345512}.center{text-align:center}.word{font-size:38px;font-weight:800;text-align:center;margin:32px 0 12px}.hint{color:#6c7e92;text-align:center;line-height:1.7}.answer{font-size:22px;line-height:1.9;text-align:center;margin:20px 0}.hide{display:none}.buttons button{flex:1}.wide{width:100%}.bar{background:#e3edfa;height:8px;border-radius:8px;margin:18px 0}.bar span{display:block;background:#176be7;height:8px;border-radius:8px}.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:18px}.chips button{font-size:12px;padding:10px 1px}.full{white-space:pre-line;line-height:2;font-size:19px}.entry{border-bottom:1px solid #edf1f6;padding:9px 0;line-height:1.7}footer{text-align:center;color:#8797aa;font-size:12px;margin-top:24px}</style></head><body><main><header><h1>✝ 主祷文</h1><p>简体中文 · 教会版本 · 背诵练习</p></header><nav><button class="on" data-tab="practice">逐句背诵</button><button data-tab="keywords">口诀记忆</button><button data-tab="test">随机测试</button><button data-tab="full">完整经文</button></nav><section id="practice" class="card"><p class="hint" id="count"></p><div class="bar"><span id="progress"></span></div><div class="word" id="key"></div><p class="hint">看提示，先自己背，再查看答案</p><div id="answer" class="answer hide"></div><button class="primary wide" id="reveal">查看答案</button><div class="buttons"><button id="prev">← 上一句</button><button class="primary" id="next">下一句 →</button></div><div class="chips" id="chips"></div></section><section id="keywords" class="card hide"><h2>十句记忆口诀</h2><p>天父 → 圣名 → 降国 → 行旨 → 饮食 → 免债 → 试探 → 脱恶 → 国权荣 → 永远阿们</p><div id="entries"></div></section><section id="test" class="card hide center"><h2>随机测试</h2><div class="word" id="testkey"></div><p class="hint">试着背出这一句</p><div class="answer hide" id="testanswer"></div><button class="primary wide" id="testreveal">查看答案</button><p><button class="wide" id="random">换一道题 ↻</button></p></section><section id="full" class="card hide"><h2 class="center">主祷文</h2><div class="full" id="fulltext"></div></section><footer>按照你提供的教会投影整理</footer></main><script>const items=[["天父","我们在天上的父，"],["圣名","愿人都尊你的名为圣，"],["降国","愿你的国降临，"],["行旨","愿你的旨意行在地上，如同行在天上。"],["饮食","我们日用的饮食，今日赐给我们，"],["免债","免我们的债，如同我们免了人的债，"],["试探","不叫我们遇见试探，"],["脱恶","救我们脱离凶恶，"],["国权荣","因为国度、权柄、荣耀，全是你的，"],["永远阿们","直到永远，阿们。"]];const $=id=>document.getElementById(id);let i=0,j=0;function draw(){$("count").textContent="第 "+(i+1)+" 句 / 共 10 句";$("progress").style.width=((i+1)*10)+"%";$("key").textContent=items[i][0];$("answer").textContent=items[i][1];$("answer").classList.add("hide");$("reveal").textContent="查看答案";$("prev").disabled=i===0;$("next").textContent=i===9?"从头开始 ↻":"下一句 →";$("chips").innerHTML="";items.forEach((x,n)=>{let b=document.createElement("button");b.textContent=x[0];if(n===i)b.className="on";b.onclick=()=>{i=n;draw()};$("chips").appendChild(b)})}function random(){j=Math.floor(Math.random()*10);$("testkey").textContent=items[j][0];$("testanswer").textContent=items[j][1];$("testanswer").classList.add("hide");$("testreveal").textContent="查看答案"}function toggle(id,btn){let hidden=$(id).classList.toggle("hide");$(btn).textContent=hidden?"查看答案":"隐藏答案"}$("reveal").onclick=()=>toggle("answer","reveal");$("testreveal").onclick=()=>toggle("testanswer","testreveal");$("random").onclick=random;$("prev").onclick=()=>{if(i){i--;draw()}};$("next").onclick=()=>{i=(i+1)%10;draw()};document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));["practice","keywords","test","full"].forEach(t=>$(t).classList.toggle("hide",t!==b.dataset.tab))});$("entries").innerHTML=items.map((x,n)=>'<div class="entry"><b>'+(n+1)+'. '+x[0]+'</b><div>'+x[1]+'</div></div>').join("");$("fulltext").textContent="我们在天上的父，愿人都尊你的名为圣，\n愿你的国降临，愿你的旨意行在地上，如同行在天上。\n\n我们日用的饮食，今日赐给我们，\n免我们的债，如同我们免了人的债，\n不叫我们遇见试探，救我们脱离凶恶，\n因为国度、权柄、荣耀，全是你的，\n直到永远，阿们。";draw();random();</script></body></html>
